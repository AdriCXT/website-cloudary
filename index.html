<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLOUDARY Portal</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: #000; 
            color: #fff; 
            line-height: 1.6; 
            transition: all 0.3s ease; 
        }
        header { 
            background: linear-gradient(135deg, #000, #1a1a1a); 
            padding: 1.5rem 2rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 4px 20px rgba(45, 90, 39, 0.3); 
            border-bottom: 1px solid #2d5a27; 
        }
        #greeting { margin: 0; font-weight: 300; font-size: 1.5rem; }
        #logout-btn { 
            background: #2d5a27; 
            color: #fff; 
            border: none; 
            padding: 0.75rem 1.5rem; 
            border-radius: 16px; 
            cursor: pointer; 
            font-size: 0.9rem; 
            transition: all 0.3s ease; 
            box-shadow: 0 2px 10px rgba(45, 90, 39, 0.5); 
        }
        #logout-btn:hover { background: #3a6b3a; transform: translateY(-2px); }
        main { padding: 2rem; max-width: 1200px; margin: 0 auto; }
        .tile { 
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a); 
            border: 1px solid #2d5a27; 
            padding: 1.5rem; 
            margin: 1rem 0; 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(45, 90, 39, 0.2); 
            transition: all 0.3s ease; 
            display: flex; 
            flex-direction: column; 
            align-items: flex-start; 
        }
        .tile:hover { transform: translateY(-5px); box-shadow: 0 8px 30px rgba(45, 90, 39, 0.4); }
        .tile h3 { margin: 0 0 0.5rem 0; color: #2d5a27; }
        .tile a { color: #2d5a27; text-decoration: none; font-weight: 500; transition: color 0.3s ease; }
        .tile a:hover { color: #3a6b3a; }
        .hidden { display: none; }
        #login-section { 
            max-width: 400px; 
            margin: 5rem auto; 
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a); 
            padding: 2rem; 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(45, 90, 39, 0.3); 
            border: 1px solid #2d5a27; 
        }
        #login-section h2 { text-align: center; color: #2d5a27; margin-bottom: 1.5rem; }
        #login-form { display: flex; flex-direction: column; gap: 1rem; }
        #login-form input { 
            padding: 0.75rem; 
            border: 1px solid #2d5a27; 
            border-radius: 12px; 
            background: #333; 
            color: #fff; 
            font-size: 1rem; 
        }
        #login-form button { 
            background: #2d5a27; 
            color: #fff; 
            border: none; 
            padding: 0.75rem; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 1rem; 
            transition: all 0.3s ease; 
            box-shadow: 0 2px 10px rgba(45, 90, 39, 0.5); 
        }
        #login-form button:hover { background: #3a6b3a; transform: translateY(-2px); }
        .message { 
            margin-top: 1rem; 
            padding: 0.75rem; 
            border-radius: 12px; 
            text-align: center; 
            font-weight: 500; 
        }
        .message.error { background: rgba(220, 53, 69, 0.2); color: #ff6b6b; border: 1px solid #dc3545; }
        .message.success { background: rgba(40, 167, 69, 0.2); color: #28a745; border: 1px solid #28a745; }
        .message.info { background: rgba(0, 123, 255, 0.2); color: #007bff; border: 1px solid #007bff; }
        #admin-content { 
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a); 
            padding: 2rem; 
            margin-top: 2rem; 
            border-radius: 16px; 
            box-shadow: 0 4px 20px rgba(45, 90, 39, 0.3); 
            border: 1px solid #2d5a27; 
        }
        #admin-content h3 { color: #2d5a27; margin-bottom: 1.5rem; }
        #user-form { display: flex; flex-direction: column; gap: 1rem; }
        #user-form input, #user-form fieldset { 
            padding: 0.75rem; 
            border: 1px solid #2d5a27; 
            border-radius: 12px; 
            background: #333; 
            color: #fff; 
        }
        #user-form fieldset { border: 1px solid #2d5a27; padding: 1rem; }
        #user-form label { display: block; margin-bottom: 0.5rem; color: #2d5a27; }
        #user-form button { 
            background: #2d5a27; 
            color: #fff; 
            border: none; 
            padding: 0.75rem; 
            border-radius: 12px; 
            cursor: pointer; 
            font-size: 1rem; 
            transition: all 0.3s ease; 
            box-shadow: 0 2px 10px rgba(45, 90, 39, 0.5); 
        }
        #user-form button:hover { background: #3a6b3a; transform: translateY(-2px); }
        #user-list { list-style: none; padding: 0; margin-top: 2rem; }
        #user-list li { 
            background: #333; 
            padding: 1rem; 
            margin: 0.5rem 0; 
            border-radius: 12px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 2px 10px rgba(45, 90, 39, 0.2); 
            transition: all 0.3s ease; 
        }
        #user-list li:hover { background: #444; }
        #user-list button { 
            background: #dc3545; 
            color: #fff; 
            border: none; 
            padding: 0.5rem 1rem; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 0.8rem; 
            transition: all 0.3s ease; 
        }
        #user-list button:hover { background: #c82333; transform: translateY(-1px); }
        footer { 
            text-align: center; 
            padding: 1.5rem; 
            background: linear-gradient(135deg, #000, #1a1a1a); 
            color: #aaa; 
            border-top: 1px solid #2d5a27; 
            margin-top: 2rem; 
        }
        footer a { color: #2d5a27; text-decoration: none; }
        footer a:hover { color: #3a6b3a; }
    </style>
</head>
<body>
    <header>
        <h2 id="greeting">Willkommen im CLOUDARY Portal</h2>
        <button id="logout-btn" class="hidden">Abmelden</button>
    </header>
    <main>
        <section id="login-section">
            <h2>Anmeldung</h2>
            <form id="login-form">
                <input type="password" id="password" placeholder="Passwort eingeben" required />
                <button type="submit">Anmelden</button>
            </form>
            <div id="login-message" class="message hidden"></div>
        </section>
        <section id="main-content" class="hidden">
            <div class="tile" data-tile-id="cloud">
                <h3>Cloud</h3>
                <p>Zugriff auf Cloud-Dienste.</p>
                <a href="https://cloud.cloudary.de" target="_blank">Öffnen</a>
            </div>
            <div class="tile" data-tile-id="truenas">
                <h3>TRUENAS</h3>
                <p>Zugriff auf NAS-Speicher.</p>
                <a href="https://truenas.cloudary.de" target="_blank">Öffnen</a>
            </div>
            <div class="tile" data-tile-id="support">
                <h3>Support</h3>
                <p>Kontakt zum Support.</p>
                <a href="mailto:webmaster@cloudary.de">Mail senden</a>
            </div>
        </section>
        <div id="admin-content" class="hidden">
            <h3>Admin Dashboard</h3>
            <form id="user-form">
                <input type="text" id="user-name" placeholder="Name" required />
                <input type="password" id="user-password" placeholder="Passwort" required />
                <fieldset>
                    <legend>Sichtbare Kacheln:</legend>
                    <label><input type="checkbox" value="cloud" /> Cloud</label>
                    <label><input type="checkbox" value="truenas" /> TRUENAS</label>
                    <label><input type="checkbox" value="support" /> Support</label>
                </fieldset>
                <button type="submit">Benutzer erstellen</button>
            </form>
            <ul id="user-list"></ul>
        </div>
    </main>
    <footer>
        <p>&copy; <span id="year"></span> CLOUDARY. Alle Rechte vorbehalten. <a href="mailto:webmaster@cloudary.de">Support</a></p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
